version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: globetrotter_backend
    ports:
      - "5000:5000"
    volumes:
      - ./app:/globetrotter/app
      - ./data:/globetrotter/data
    environment:
      - PORT=5000
      - FLASK_DEBUG=1
      - SECRET_KEY=globetrotter-super-secret-key-2026

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: globetrotter_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
